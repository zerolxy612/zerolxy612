<svg xmlns="http://www.w3.org/2000/svg" width="850" height="260" viewBox="0 0 850 260" fill="none" role="img" aria-label="zerolxy612 - Frontend / Full-stack Developer">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05010f"/>
      <stop offset="55%" stop-color="#0a0420"/>
      <stop offset="100%" stop-color="#12002e"/>
    </linearGradient>

    <!-- Neon title gradient (animated) -->
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff2fd0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.5 0; 0.5 0; -0.5 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff2fd0" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#2a1a4a" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="850" height="260" rx="18" fill="url(#bg)"/>
  <rect width="850" height="260" rx="18" fill="url(#grid)"/>

  <!-- Ambient glow blobs -->
  <circle cx="120" cy="60" r="90" fill="#00f0ff" opacity="0.10" filter="url(#softglow)"/>
  <circle cx="740" cy="210" r="110" fill="#ff2fd0" opacity="0.10" filter="url(#softglow)"/>

  <!-- Corner brackets (cyberpunk HUD) -->
  <g stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.8">
    <path d="M20 40 L20 20 L40 20"/>
    <path d="M830 40 L830 20 L810 20"/>
    <path d="M20 220 L20 240 L40 240"/>
    <path d="M830 220 L830 240 L810 240"/>
  </g>

  <!-- Title -->
  <text x="60" y="128" font-family="'JetBrains Mono','Courier New',monospace" font-size="72" font-weight="800"
    fill="url(#neon)" filter="url(#glow)">&lt;lxy/&gt;</text>

  <!-- Blinking cursor -->
  <rect x="370" y="72" width="14" height="60" fill="#00f0ff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Animated underline -->
  <rect x="62" y="150" width="470" height="3" fill="url(#line)">
    <animate attributeName="width" values="0;470;470" dur="2.2s" fill="freeze"/>
  </rect>

  <!-- Subtitle -->
  <text x="64" y="188" font-family="'JetBrains Mono','Courier New',monospace" font-size="20" font-weight="600"
    fill="#c9b8ff" letter-spacing="2">Frontend / Full-stack Developer</text>

  <!-- Tag chips -->
  <g font-family="'JetBrains Mono','Courier New',monospace" font-size="13" font-weight="600">
    <g transform="translate(64,208)">
      <rect width="78" height="26" rx="13" fill="none" stroke="#00f0ff" stroke-opacity="0.6"/>
      <text x="39" y="18" text-anchor="middle" fill="#00f0ff">React</text>
    </g>
    <g transform="translate(152,208)">
      <rect width="102" height="26" rx="13" fill="none" stroke="#a855f7" stroke-opacity="0.6"/>
      <text x="51" y="18" text-anchor="middle" fill="#c98bff">TypeScript</text>
    </g>
    <g transform="translate(264,208)">
      <rect width="80" height="26" rx="13" fill="none" stroke="#ff2fd0" stroke-opacity="0.6"/>
      <text x="40" y="18" text-anchor="middle" fill="#ff7ae0">Next.js</text>
    </g>
    <g transform="translate(354,208)">
      <rect width="86" height="26" rx="13" fill="none" stroke="#00f0ff" stroke-opacity="0.6"/>
      <text x="43" y="18" text-anchor="middle" fill="#00f0ff">Node.js</text>
    </g>
  </g>

  <!-- Decorative status readout on the right -->
  <g font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#6f5a9e" text-anchor="end">
    <text x="810" y="70">$ whoami</text>
    <text x="810" y="90" fill="#00f0ff">&gt; zerolxy612</text>
    <text x="810" y="118">status: <tspan fill="#39ff88">online</tspan></text>
  </g>
</svg>
